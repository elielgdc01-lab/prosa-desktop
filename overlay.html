<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prosa sobreposição</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: https://ovetqupsrjavyeckbiyg.supabase.co; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html,body{margin:0;background:transparent;overflow:hidden;font:600 13px/1.2 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none}
  #list{display:flex;flex-direction:column;gap:6px;padding:10px}
  .p{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:rgba(14,11,9,.62);width:max-content;max-width:240px;transition:background .15s;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .p.talk{background:rgba(14,11,9,.8)}
  .av{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px transparent;transition:box-shadow .1s;background:#ffb224;display:grid;place-items:center;color:#231a05;font-weight:800}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .p.talk .av{box-shadow:0 0 0 2.5px #3fbf85}
  .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m{opacity:.85;color:#ff8a7e}
  .m svg{width:13px;height:13px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .head{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(255,178,36,.92);color:#231a05;font-size:11.5px;font-weight:800;letter-spacing:.02em;width:max-content}
  .head i{width:6px;height:6px;border-radius:50%;background:#231a05;display:block}
</style>
</head>
<body>
<div id="list"></div>
<script src="overlay.js"></script>
</body>
</html>
